name: Gold trading bot

on:
  schedule:
    # Every 15 minutes on weekdays, 13:00-21:59 UTC.
    # That covers market hours (9:30am-4pm New York) in both summer and winter time.
    - cron: "7,22,37,52 13-21 * * 1-5"
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install alpaca-py pandas
      - run: python bot.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
