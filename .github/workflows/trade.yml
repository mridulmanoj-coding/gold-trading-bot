name: Gold trading bot

on:
  workflow_dispatch:

concurrency:
  group: gold-bot

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install alpaca-py pandas
      - run: python bot.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          
